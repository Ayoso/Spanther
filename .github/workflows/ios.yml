name: iOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gazecore-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: GazeCore unit tests
        working-directory: SpantherGaze/GazeCore
        run: swift test

  unsigned-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Build for iPhone without signing
        run: |
          set -o pipefail
          xcodebuild \
            -project SpantherGaze/SpantherGaze.xcodeproj \
            -target SpantherGaze \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Check bundled resources
        run: test -f build/Release-iphoneos/SpantherGaze.app/balance.json
      - name: Package .ipa
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/SpantherGaze.app Payload/
          zip -qry SpantherGaze-unsigned.ipa Payload
      # What Sideloadly needs from the file (SIDELOAD.md): Payload/<app>/ with the binary and Info.plist,
      # an arm64 binary, and the keys iOS checks on install and on first launch.
      - name: Check the .ipa
        run: |
          set -e
          unzip -l SpantherGaze-unsigned.ipa > ipa-files.txt
          grep -q " Payload/SpantherGaze.app/SpantherGaze$" ipa-files.txt
          grep -q " Payload/SpantherGaze.app/Info.plist$" ipa-files.txt
          grep -q " Payload/SpantherGaze.app/balance.json$" ipa-files.txt
          APP=build/Release-iphoneos/SpantherGaze.app
          lipo -info "$APP/SpantherGaze"
          lipo -info "$APP/SpantherGaze" | grep -q arm64
          for key in CFBundleIdentifier CFBundleShortVersionString CFBundleVersion MinimumOSVersion NSCameraUsageDescription ITSAppUsesNonExemptEncryption; do
            value=$(/usr/libexec/PlistBuddy -c "Print :$key" "$APP/Info.plist")
            echo "$key: $value"
          done
          # App Store Connect refuses a build without an app icon (Assets.xcassets/AppIcon).
          grep -q " Payload/SpantherGaze.app/Assets.car$" ipa-files.txt
          ICON=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName" "$APP/Info.plist")
          echo "App icon: $ICON"
          test "$ICON" = AppIcon
          # Version and build come from MARKETING_VERSION and CURRENT_PROJECT_VERSION, never a literal $(...).
          VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")
          case "$VER|$BUILD" in *'$'*|'|'*|*'|') echo "Version not expanded: $VER ($BUILD)"; exit 1;; esac
          # App Store Connect refuses builds that use required-reason APIs (UserDefaults) without a privacy manifest.
          grep -q " Payload/SpantherGaze.app/PrivacyInfo.xcprivacy$" ipa-files.txt
          ls -l SpantherGaze-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: SpantherGaze-unsigned-ipa
          path: SpantherGaze-unsigned.ipa
          retention-days: 30

  # The Mac that installs on a phone will usually have the newest Xcode and build Debug.
  newest-xcode-debug:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest installed Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
      - name: Debug build for iPhone without signing
        run: |
          set -o pipefail
          xcodebuild \
            -project SpantherGaze/SpantherGaze.xcodeproj \
            -target SpantherGaze \
            -configuration Debug \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
          test -f build/Debug-iphoneos/SpantherGaze.app/balance.json

  # Runs the app in the iOS Simulator with the built-in bot (Debug launch argument -SpantherAutoplay),
  # checks that it does not crash and that the energy loop runs (kills spend energy, reloads happen),
  # and pushes screenshots, the session CSVs and logs to the ci-screenshots branch so they can be looked
  # at without a Mac. There is no face tracking in the Simulator, so "eyes" mode uses the bot's gaze.
  simulator-smoke:
    runs-on: macos-15
    # About 42 minutes since the warm-up, the red signs and the report screens joined the plays (11 November:
    # play step 25, iPhone SE step 13), most of it fixed waits and the SE simulator's boot. On a slow runner
    # (main, 9 November) the play step took a third longer and the SE step ran past 30.
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build for the Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project SpantherGaze/SpantherGaze.xcodeproj \
            -target SpantherGaze \
            -configuration Debug \
            -sdk iphonesimulator \
            ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=NO \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -n 20
          codesign --force --sign - --timestamp=none build/Debug-iphonesimulator/SpantherGaze.app
      - name: Boot an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for runtime, ds in devices.items() if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")]
          pick = next((d for d in phones if d["name"] in ("iPhone 16", "iPhone 15")), phones[-1])
          print(pick["udid"])
          ')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$UDID" -b
      - name: Play with the bot and take screenshots
        run: |
          OUT="$PWD/out"; mkdir -p "$OUT"
          BID=com.spanther.SpantherGaze
          xcrun simctl install "$UDID" build/Debug-iphonesimulator/SpantherGaze.app
          shot() {
            xcrun simctl io "$UDID" screenshot --type=png "$OUT/tmp.png" >/dev/null 2>&1 \
              && sips -s format jpeg -s formatOptions 80 -Z 1200 "$OUT/tmp.png" --out "$OUT/$1.jpg" >/dev/null 2>&1
            rm -f "$OUT/tmp.png"
          }
          running() { xcrun simctl spawn "$UDID" launchctl list | grep -q "UIKitApplication:$BID"; }
          count() { local n; n=$(grep -c "^$1," "$2" 2>/dev/null) || true; echo "${n:-0}"; }
          pass() { echo "PASS $1" >> "$OUT/checks.txt"; }
          fail() { echo "FAIL $1" >> "$OUT/checks.txt"; }
          : > "$OUT/checks.txt"

          xcrun simctl launch --stdout="$OUT/menu.stdout.log" --stderr="$OUT/menu.stderr.log" "$UDID" "$BID"
          sleep 8; shot 00-menu
          if running; then pass "menu: app running"; else fail "menu: app not running"; fi
          xcrun simctl terminate "$UDID" "$BID" || true

          for mode in eyes touch; do
            xcrun simctl launch --stdout="$OUT/$mode.stdout.log" --stderr="$OUT/$mode.stderr.log" "$UDID" "$BID" -SpantherAutoplay "$mode"
            for i in $(seq -w 1 30); do sleep 2; shot "$mode-$i"; done
            if running; then pass "$mode: app running after 60 s"; else fail "$mode: app not running after 60 s"; fi
            DATA=$(xcrun simctl get_app_container "$UDID" "$BID" data 2>/dev/null) || true
            CSV=$(ls -t "$DATA"/tmp/spanther-*.csv 2>/dev/null | head -n 1) || true
            if [ -n "$CSV" ]; then cp "$CSV" "$OUT/$mode.csv"; fi
            A=$(count asteroid "$OUT/$mode.csv"); E=$(count energy "$OUT/$mode.csv")
            R=$(count reload "$OUT/$mode.csv"); L=$(count level "$OUT/$mode.csv")
            if [ "$A" -ge 5 ]; then pass "$mode: $A meteors logged"; else fail "$mode: only $A meteors logged"; fi
            if [ "$E" -ge 5 ]; then pass "$mode: $E kills spent energy"; else fail "$mode: only $E kills spent energy"; fi
            if [ "$R" -ge 1 ]; then pass "$mode: pool ran dry and was reloaded $R times"; else fail "$mode: no reload"; fi
            if [ "$L" -ge 1 ]; then pass "$mode: level 1 ended"; else fail "$mode: level 1 never ended"; fi
            if python3 - "$OUT/$mode.csv" SpantherGaze/SpantherGaze/Resources/balance.json > "$OUT/$mode.energy.txt" <<'PY'
          import csv, json, sys
          energy_cfg = json.load(open(sys.argv[2]))["energy"]
          full, cost = energy_cfg["max"], energy_cfg["costByClass"]
          energy, spent, errors = full, None, []
          for r in csv.DictReader(open(sys.argv[1])):
              kind = r["kind"]
              if kind == "energy":
                  spent = int(r["energy"])
              elif kind == "asteroid" and r["destroyed"] == "1":
                  expected = max(0, energy - min(cost[r["class"]], full))
                  if spent != expected:
                      errors.append(f"{r['time']}: {r['class']} kill left {spent}, expected {expected}")
                  energy, spent = (spent if spent is not None else energy), None
              elif kind in ("reload", "level", "restart"):
                  energy = int(r["energy"])
                  if energy != full:
                      errors.append(f"{r['time']}: {kind} left {energy}, expected a full pool of {full}")
          print("\n".join(errors) or "energy accounting matches balance.json")
          sys.exit(1 if errors else 0)
          PY
            then pass "$mode: energy accounting matches balance.json"; else fail "$mode: energy accounting (see $mode.energy.txt)"; fi
            # Red signs: the bot looks at every third one and passes the others by, and the play is set up with
            # small targets (balance.json targetScale).
            if python3 - "$OUT/$mode.csv" SpantherGaze/SpantherGaze/Resources/balance.json > "$OUT/$mode.signs.txt" 2>&1 <<'PY'
          import csv, json, sys
          scale = json.load(open(sys.argv[2]))["targetScale"]
          rows = list(csv.DictReader(open(sys.argv[1])))
          games = [r for r in rows if r["kind"] == "game"]
          signs = [r for r in rows if r["kind"] == "decoy"]
          looked = [r for r in signs if r["decoy_looked"] == "1"]
          passed = [r for r in signs if r["decoy_looked"] == "0"]
          set_up = games[0] if games else {"target_scale": "0", "decoy_looked": ""}
          print(f"{len(signs)} red signs, {len(looked)} looked at, {len(passed)} passed by,"
                f" target scale {float(set_up['target_scale']):.2f}, signs on {set_up['decoy_looked']}")
          # A look that became an error began after the sign appeared and lasted at least the threshold.
          timed = all(r["reaction_s"] and 0 <= float(r["reaction_s"]) < float(r["lifetime_s"]) for r in looked)
          ok = (len(games) == 1 and abs(float(set_up["target_scale"]) - scale) < 0.001 and set_up["decoy_looked"] == "1"
                and len(looked) >= 1 and len(passed) >= 2 and timed)
          sys.exit(0 if ok else 1)
          PY
            then pass "$mode: $(tail -n 1 "$OUT/$mode.signs.txt")"; else fail "$mode: red signs: $(tail -n 1 "$OUT/$mode.signs.txt")"; fi
            if [ "$mode" = eyes ]; then
              # By eye the bot leaves the game after two minutes of play: the play goes into the history
              # (Application Support/sessions.json) and its summary opens on the menu.
              SJ="$DATA/Library/Application Support/sessions.json"
              for i in $(seq 1 50); do
                if [ -f "$SJ" ] && grep -q '"meteors"' "$SJ"; then break; fi
                sleep 3
              done
              sleep 4; shot eyes-summary
              if running; then pass "eyes: app running on the summary"; else fail "eyes: app not running on the summary"; fi
              if [ -f "$SJ" ]; then cp "$SJ" "$OUT/sessions-eyes.json"; fi
              if python3 - "$OUT/sessions-eyes.json" > "$OUT/eyes.play.txt" 2>&1 <<'PY'
          import json, sys
          plays = [p for p in json.load(open(sys.argv[1])) if p["game"] == "meteors"]
          p = plays[-1] if plays else {}
          print(f"{len(plays)} meteor play kept: {p.get('burned')} of {p.get('meteors')} burned,"
                f" hold {p.get('holdShare', 0):.2f}, red signs looked at {p.get('decoyErrors')} of {p.get('decoys')},"
                f" target scale {p.get('targetScale')}")
          ok = (len(plays) == 1 and p["meteors"] >= 10 and 0 < p["holdShare"] <= 1 and p["decoys"] >= 6
                and 1 <= p["decoyErrors"] < p["decoys"] and abs(p["targetScale"] - 0.7) < 0.01)
          sys.exit(0 if ok else 1)
          PY
              then pass "eyes: $(tail -n 1 "$OUT/eyes.play.txt")"; else fail "eyes: saved play: $(tail -n 1 "$OUT/eyes.play.txt")"; fi
              # The music: the app writes what its engine did when the game closes. A runner without a sound
              # device cannot start the engine; that is noted, not failed.
              cp "$DATA/tmp/ambient.txt" "$OUT/ambient.txt" 2>/dev/null || true
              if [ -f "$OUT/ambient.txt" ]; then
                if python3 - "$OUT/ambient.txt" <<'PY'
          import re, sys
          m = re.search(r"ambient playing, (\d+) Hz, (\d+) frames, peak ([0-9.]+)", open(sys.argv[1]).read())
          sys.exit(0 if m and int(m.group(2)) > int(m.group(1)) and 0.01 < float(m.group(3)) < 0.75 else 1)
          PY
                then pass "music: $(cat "$OUT/ambient.txt")"; else echo "NOTE music: $(cat "$OUT/ambient.txt")" >> "$OUT/checks.txt"; fi
              else
                fail "music: the game closed without writing ambient.txt"
              fi
            fi
            xcrun simctl terminate "$UDID" "$BID" || true
          done

          # Wink test: a scripted player winks on the cues (WinkBot), since the Simulator has no face tracking.
          # The run starts 5 s after the screen opens and takes about 77 s.
          xcrun simctl launch --stdout="$OUT/wink.stdout.log" --stderr="$OUT/wink.stderr.log" "$UDID" "$BID" -SpantherAutoplay wink
          sleep 4; shot wink-0-intro
          sleep 11; shot wink-1-left-a
          sleep 0.4; shot wink-1-left-b
          sleep 25; shot wink-2-right
          sleep 23; shot wink-3-alternating
          sleep 26; shot wink-4-results
          if running; then pass "wink: app running after the test"; else fail "wink: app not running after the test"; fi
          DATA=$(xcrun simctl get_app_container "$UDID" "$BID" data 2>/dev/null) || true
          CSV=$(ls -t "$DATA"/tmp/spanther-*.csv 2>/dev/null | head -n 1) || true
          if [ -n "$CSV" ]; then cp "$CSV" "$OUT/wink.csv"; fi
          if python3 - "$OUT/wink.csv" > "$OUT/wink.check.txt" 2>&1 <<'PY'
          import csv, sys
          rows = list(csv.DictReader(open(sys.argv[1])))
          runs = sum(1 for r in rows if r["kind"] == "wink_test")
          frames = sum(1 for r in rows if r["kind"] == "wink_frame")
          cues = [(float(r["time"]), r["side"]) for r in rows if r["kind"] == "cue"]
          winks = [(float(r["time"]), r["side"]) for r in rows if r["kind"] == "wink"]
          used, asked, hits, wrong, both = set(), {"left": 0, "right": 0}, {"left": 0, "right": 0}, 0, 0
          for t, side in cues:
              asked[side] += 1
              near = [(abs(w[0] - t), i) for i, w in enumerate(winks) if i not in used and abs(w[0] - t) <= 0.45]
              if not near:
                  continue
              i = min(near)[1]
              used.add(i)
              if winks[i][1] == side:
                  hits[side] += 1
              elif winks[i][1] == "both":
                  both += 1
              else:
                  wrong += 1
          # WinkBot answers 27 of 30 left cues and 24 of 30 right ones with the asked eye.
          print(f"{runs} run, {len(cues)} cues, {len(winks)} closures, {frames} frames, hits left {hits['left']}/{asked['left']}"
                f" right {hits['right']}/{asked['right']}, wrong eye {wrong}, both eyes {both}")
          sys.exit(0 if runs == 1 and len(cues) == 60 and frames >= 3000 and hits["left"] >= 25 and hits["right"] >= 22 else 1)
          PY
          then pass "wink: $(tail -n 1 "$OUT/wink.check.txt")"; else fail "wink: $(tail -n 1 "$OUT/wink.check.txt")"; fi
          xcrun simctl terminate "$UDID" "$BID" || true

          # Rhythm mode: the bot picks the fastest track on hard 8 s after the list appears, winks at the start star
          # 6 s later, then looks at each note and winks the asked eye about 0.1 s after its beat. The track takes
          # about 61 s. `simctl launch` can return seconds after the app is up, so each shot sits mid-screen in time.
          xcrun simctl launch --stdout="$OUT/rhythm.stdout.log" --stderr="$OUT/rhythm.stderr.log" "$UDID" "$BID" -SpantherAutoplay rhythm
          sleep 2; shot rhythm-0-tracks
          sleep 8; shot rhythm-1-start
          sleep 11; shot rhythm-2-play-a
          sleep 0.3; shot rhythm-2-play-b
          sleep 15; shot rhythm-3-play
          sleep 20; shot rhythm-4-play
          sleep 24; shot rhythm-5-results
          if running; then pass "rhythm: app running after the track"; else fail "rhythm: app not running after the track"; fi
          DATA=$(xcrun simctl get_app_container "$UDID" "$BID" data 2>/dev/null) || true
          CSV=$(ls -t "$DATA"/tmp/spanther-*.csv 2>/dev/null | head -n 1) || true
          if [ -n "$CSV" ]; then cp "$CSV" "$OUT/rhythm.csv"; fi
          if python3 - "$OUT/rhythm.csv" > "$OUT/rhythm.check.txt" 2>&1 <<'PY'
          import csv, sys
          rows = list(csv.DictReader(open(sys.argv[1])))
          starts = [r for r in rows if r["kind"] == "rhythm_start"]
          ends = [r for r in rows if r["kind"] == "rhythm_end"]
          hits = [r for r in rows if r["kind"] == "note_hit"]
          misses = [r for r in rows if r["kind"] == "note_miss"]
          notes = int(starts[0]["note"]) if starts else 0
          played = sum(1 for r in hits if r["judgement"] != "miss")
          judged = {r["note"] for r in hits} | {r["note"] for r in misses}
          # The bot's aim sits near each note, so the hidden aim should be locked on the note it winks at.
          locked = sum(1 for r in hits if r.get("locked", "") == r["note"])
          end = ends[0] if ends else {"accuracy": "0", "latency_s": "0", "score": "0"}
          print(f"{len(starts)} start, {len(ends)} end, {notes} notes, {played} played, {len(misses)} missed,"
                f" {len(judged)} judged, {locked} of {len(hits)} winks on the locked note,"
                f" accuracy {float(end['accuracy']):.2f}, learned delay {float(end['latency_s']) * 1000:.0f} ms,"
                f" score {end['score']}")
          # The bot skips every 11th note and winks the wrong eye on every 17th, so about 85% are played.
          ok = (len(starts) == 1 and len(ends) == 1 and notes >= 60 and len(judged) == notes and played >= 0.75 * notes
                and locked >= 0.9 * len(hits)
                and float(end["accuracy"]) >= 0.6 and 0.05 <= float(end["latency_s"]) <= 0.16)
          sys.exit(0 if ok else 1)
          PY
          then pass "rhythm: $(tail -n 1 "$OUT/rhythm.check.txt")"; else fail "rhythm: $(tail -n 1 "$OUT/rhythm.check.txt")"; fi
          # The play screen must move: in the first build the canvas kept its first frame while the game ran on.
          if cmp -s "$OUT/rhythm-3-play.jpg" "$OUT/rhythm-4-play.jpg" || cmp -s "$OUT/rhythm-2-play-a.jpg" "$OUT/rhythm-2-play-b.jpg"; then
            fail "rhythm: the play screen did not change between screenshots"
          else
            pass "rhythm: the play screen changes between screenshots"
          fi
          xcrun simctl terminate "$UDID" "$BID" || true

          # Warm-up: the dot rests for 4 s, then moves for a minute. The bot follows it a little late and a little
          # off, has no gaze for 3 s of the horizontal part and stares into a corner for 3 s of the eight. When the
          # minute ends the summary opens on the menu. A screenshot takes about 4 s on the runner, so each one
          # waits for its own second after the launch instead of sleeping after the one before. The dot starts to
          # move about 6 s after the launch: the horizontal part is then on screen from 6 to 26 s, the vertical
          # one to 46 s and the eight to 66 s.
          T0=$(python3 -c 'import time; print(time.time())')
          since_launch() { python3 -c 'import sys, time; time.sleep(max(0, float(sys.argv[1]) + float(sys.argv[2]) - time.time()))' "$T0" "$1"; }
          xcrun simctl launch --stdout="$OUT/pursuit.stdout.log" --stderr="$OUT/pursuit.stderr.log" "$UDID" "$BID" -SpantherAutoplay pursuit
          since_launch 2.5; shot pursuit-0-countdown
          since_launch 13; shot pursuit-1-horizontal-a
          shot pursuit-1-horizontal-b
          since_launch 35; shot pursuit-2-vertical
          since_launch 55; shot pursuit-3-eight
          since_launch 88; shot pursuit-4-summary
          if running; then pass "warm-up: app running after the minute"; else fail "warm-up: app not running after the minute"; fi
          if cmp -s "$OUT/pursuit-1-horizontal-a.jpg" "$OUT/pursuit-1-horizontal-b.jpg" || cmp -s "$OUT/pursuit-2-vertical.jpg" "$OUT/pursuit-3-eight.jpg"; then
            fail "warm-up: the screen did not change between screenshots"
          else
            pass "warm-up: the screen changes between screenshots"
          fi
          DATA=$(xcrun simctl get_app_container "$UDID" "$BID" data 2>/dev/null) || true
          CSV=$(ls -t "$DATA"/tmp/spanther-*.csv 2>/dev/null | head -n 1) || true
          if [ -n "$CSV" ]; then cp "$CSV" "$OUT/pursuit.csv"; fi
          S=$(count pursuit_start "$OUT/pursuit.csv"); E=$(count pursuit_end "$OUT/pursuit.csv")
          if [ "$S" -eq 1 ] && [ "$E" -eq 1 ]; then pass "warm-up: started and ended once in the CSV"; else fail "warm-up: $S starts and $E ends in the CSV"; fi
          xcrun simctl terminate "$UDID" "$BID" || true

          # Session history: every finished play is kept on the phone (Application Support/sessions.json), with
          # the numbers of the report.
          SJ="$DATA/Library/Application Support/sessions.json"
          if [ -f "$SJ" ]; then cp "$SJ" "$OUT/sessions.json"; fi
          if python3 - "$OUT/sessions.json" > "$OUT/sessions.check.txt" 2>&1 <<'PY'
          import json, sys
          plays = json.load(open(sys.argv[1]))
          rhythm = [p for p in plays if p["game"] == "rhythm"]
          last = rhythm[-1] if rhythm else {}
          print(f"{len(plays)} plays kept, {len(rhythm)} rhythm, the last with {last.get('hits')} of {last.get('notes')} notes"
                f" played, accuracy {last.get('accuracy', 0):.2f}, timing deviation {last.get('timingDeviationMs', 0):.0f} ms,"
                f" gaze held {last.get('holdShare', 0):.2f}, winks left {last.get('winkLeft', 0):.2f}"
                f" right {last.get('winkRight', 0):.2f}")
          # The bot winks 0.04 to 0.16 s after the beat, so its notes lie about 30 ms from its own mean lateness.
          ok = (rhythm and last["notes"] >= 60 and last["hits"] >= 0.75 * last["notes"]
                and 10 <= last["timingDeviationMs"] <= 60 and last["holdShare"] >= 0.9
                and 0.7 <= last["winkLeft"] <= 1 and 0.7 <= last["winkRight"] <= 1)
          sys.exit(0 if ok else 1)
          PY
          then pass "history: $(tail -n 1 "$OUT/sessions.check.txt")"; else fail "history: $(tail -n 1 "$OUT/sessions.check.txt")"; fi
          if python3 - "$OUT/sessions.json" > "$OUT/pursuit.check.txt" 2>&1 <<'PY'
          import json, sys
          warm = [p for p in json.load(open(sys.argv[1])) if p["game"] == "pursuit"]
          p = warm[-1] if warm else {}
          print(f"{len(warm)} warm-up kept: gaze near the dot {p.get('holdShare', 0):.2f} (horizontal"
                f" {p.get('pursuitHorizontal', 0):.2f}, vertical {p.get('pursuitVertical', 0):.2f}, eight"
                f" {p.get('pursuitEight', 0):.2f}), no gaze {p.get('pursuitLostShare', 0):.3f}, mean distance"
                f" {p.get('pursuitMeanCm', 0):.2f} cm")
          # Of the 55 scored seconds the bot is away for 6: 3 with no gaze (horizontal), 3 in a corner (eight).
          ok = (len(warm) == 1 and 0.82 <= p["holdShare"] <= 0.95 and p["pursuitVertical"] >= 0.97
                and 0.72 <= p["pursuitHorizontal"] <= 0.92 and 0.72 <= p["pursuitEight"] <= 0.93
                and 0.03 <= p["pursuitLostShare"] <= 0.09 and 0.2 <= p["pursuitMeanCm"] <= 2.5)
          sys.exit(0 if ok else 1)
          PY
          then pass "warm-up: $(tail -n 1 "$OUT/pursuit.check.txt")"; else fail "warm-up: $(tail -n 1 "$OUT/pursuit.check.txt")"; fi

          # The report screens with made-up plays (-SpantherDemoReport): the summary after a meteor play, a
          # child's history, and the settings sheet.
          for page in summary history settings; do
            xcrun simctl launch --stdout="$OUT/report-$page.stdout.log" --stderr="$OUT/report-$page.stderr.log" "$UDID" "$BID" -SpantherDemoReport "$page"
            sleep 8; shot "report-$page"
            if running; then pass "report $page: app running"; else fail "report $page: app not running"; fi
            xcrun simctl terminate "$UDID" "$BID" || true
          done
          cp ~/Library/Logs/DiagnosticReports/SpantherGaze* "$OUT/" 2>/dev/null || true
          cat "$OUT/checks.txt"
      - name: Menu and rhythm track list on the smallest screen (iPhone SE, 4.7 inch)
        run: |
          OUT="$PWD/out"; BID=com.spanther.SpantherGaze
          SE=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          se = [d for runtime, ds in devices.items() if "iOS" in runtime for d in ds if d["name"].startswith("iPhone SE")]
          print(se[-1]["udid"] if se else "")
          ')
          if [ -z "$SE" ]; then echo "NOTE no iPhone SE simulator on this runner" >> "$OUT/checks.txt"; exit 0; fi
          xcrun simctl bootstatus "$SE" -b
          xcrun simctl install "$SE" build/Debug-iphonesimulator/SpantherGaze.app
          xcrun simctl launch "$SE" "$BID"
          sleep 8
          xcrun simctl io "$SE" screenshot --type=png "$OUT/tmp.png" >/dev/null 2>&1 \
            && sips -s format jpeg -s formatOptions 80 -Z 1200 "$OUT/tmp.png" --out "$OUT/00-menu-se.jpg" >/dev/null 2>&1
          rm -f "$OUT/tmp.png"
          if xcrun simctl spawn "$SE" launchctl list | grep -q "UIKitApplication:$BID"; then
            echo "PASS menu on iPhone SE: app running" >> "$OUT/checks.txt"
          else
            echo "FAIL menu on iPhone SE: app not running" >> "$OUT/checks.txt"
          fi
          # The rhythm track list, the widest screen of the mode: the bot waits 8 s on it before it starts a track.
          xcrun simctl terminate "$SE" "$BID" || true
          xcrun simctl launch "$SE" "$BID" -SpantherAutoplay rhythm
          sleep 5
          xcrun simctl io "$SE" screenshot --type=png "$OUT/tmp.png" >/dev/null 2>&1 \
            && sips -s format jpeg -s formatOptions 80 -Z 1200 "$OUT/tmp.png" --out "$OUT/rhythm-0-tracks-se.jpg" >/dev/null 2>&1
          rm -f "$OUT/tmp.png"
          if xcrun simctl spawn "$SE" launchctl list | grep -q "UIKitApplication:$BID"; then
            echo "PASS rhythm track list on iPhone SE: app running" >> "$OUT/checks.txt"
          else
            echo "FAIL rhythm track list on iPhone SE: app not running" >> "$OUT/checks.txt"
          fi
          xcrun simctl terminate "$SE" "$BID" || true
          # The history, the report's widest screen; the summary with its four tiles; the settings sheet.
          for page in history summary settings; do
            xcrun simctl launch "$SE" "$BID" -SpantherDemoReport "$page"
            sleep 8
            xcrun simctl io "$SE" screenshot --type=png "$OUT/tmp.png" >/dev/null 2>&1 \
              && sips -s format jpeg -s formatOptions 80 -Z 1200 "$OUT/tmp.png" --out "$OUT/report-$page-se.jpg" >/dev/null 2>&1
            rm -f "$OUT/tmp.png"
            if xcrun simctl spawn "$SE" launchctl list | grep -q "UIKitApplication:$BID"; then
              echo "PASS report $page on iPhone SE: app running" >> "$OUT/checks.txt"
            else
              echo "FAIL report $page on iPhone SE: app not running" >> "$OUT/checks.txt"
            fi
            xcrun simctl terminate "$SE" "$BID" || true
          done
      - name: Publish to the ci-screenshots branch
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          TOKEN: ${{ github.token }}
          SRC: ${{ github.head_ref || github.ref_name }}
          SRC_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          [ -d out ] || exit 0
          cd out
          echo "Simulator smoke test of $SRC at $SRC_SHA, run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > README.txt
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Simulator screenshots for $SRC at $SRC_SHA"
          git push -fq "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-screenshots
      - name: Fail if a smoke check failed
        run: |
          cat out/checks.txt
          ! grep -q '^FAIL' out/checks.txt
